name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bağımlılıklar
        run: npm ci
      - name: Web dosyaları ve Capacitor senkronu
        run: |
          node build-www.js
          npx cap sync android
      - name: APK derle (debug imzalı, telefona kurulabilir)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SokakKrali-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SokakKrali-android
          path: SokakKrali-android.apk
      - name: Sürüme ekle (etiketle tetiklendiyse)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" SokakKrali-android.apk --clobber || gh release create "${{ github.ref_name }}" SokakKrali-android.apk --title "Sokak Kralı ${{ github.ref_name }}" --notes "Android APK (debug imzalı; Bilinmeyen kaynaklara izin verip kurun)."
